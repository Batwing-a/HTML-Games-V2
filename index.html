<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Games Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        
        #searchInput {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        #searchInput:focus {
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: block;
            color: #333;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .game-card-content {
            padding: 20px;
            text-align: center;
        }
        
        .game-card-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        
        .game-card-title {
            font-size: 1em;
            font-weight: 600;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .no-results {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 40px;
            grid-column: 1 / -1;
        }
        
        .game-count {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 HTML Games Collection</h1>
            <p class="subtitle">Click any game to play</p>
        </header>
        
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search games..."
                autocomplete="off"
            >
        </div>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Games will be loaded here by JavaScript -->
        </div>
        
        <div class="game-count">
            <p><span id="gameCount">0</span> games available</p>
        </div>
    </div>
    
    <script>
        // List of all games - dynamically loaded from games.json
        const games = [];

        async function loadGames() {
            try {
                const response = await fetch('./games.json');
                if (!response.ok) {
                    throw new Error(`Unable to load games.json: ${response.status}`);
                }
                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('games.json did not return an array');
                }
                games.splice(0, games.length, ...data);
                renderGames(games);
            } catch (error) {
                gridContainer.innerHTML = '<div class="no-results">Unable to load game list.</div>';
                console.error(error);
            }
        }

        const gridContainer = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const gameCount = document.getElementById('gameCount');
        
        // Map game names to emoji icons
        const gameIcons = {
            "chess": "♟️",
            "2048": "2️⃣",
            "cookie-clicker": "🍪",
            "ducklife": "🦆",
            "angry-birds": "🐦",
            "breakout": "🧱",
            "chrome-dino": "🦖",
            "flappybird": "🐦",
            "fruit-ninja": "🍎",
            "tetris": "🟦",
            "pac-man": "👾",
            "space-invaders": "👽",
            "asteroids": "🌠",
            "pacman": "👾",
            "snake": "🐍",
            "crossyroad": "🐔",
            "basketball": "🏀",
            "soccer": "⚽",
            "tennis": "🎾",
            "golf": "⛳",
            "bowling": "🎳",
            "billiards": "🎱",
            "racing": "🏎️",
            "racing-game": "🏎️",
            "car": "🚗",
            "drive": "🚗",
            "tank": "🏹",
            "war": "⚔️",
            "zombie": "🧟",
            "shooting": "🔫",
            "shooter": "🔫",
            "gun": "🔫",
            "bow": "🏹",
            "arrow": "🏹",
            "puzzle": "🧩",
            "match": "🔗",
            "connect": "🔗",
            "tower": "🗼",
            "defense": "🛡️",
            "strategy": "♟️",
            "adventure": "🎮",
            "quest": "🗺️",
            "dungeon": "🏰",
            "rpg": "⚔️",
            "role": "👤",
            "mining": "⛏️",
            "craft": "🔨",
            "tycoon": "💰",
            "business": "💼",
            "clicker": "👆",
            "idle": "⏳",
            "jump": "⬆️",
            "runner": "🏃",
            "flyer": "✈️",
            "platform": "🕹️",
            "horror": "👻",
            "scary": "😱",
            "fun": "😄",
            "casual": "😌",
            "fast": "⚡",
            "slow": "🐌",
            "relaxing": "😌",
            "music": "🎵",
            "draw": "🎨",
            "paint": "🎨",
            "art": "🖼️",
            "design": "✏️",
            "creative": "💡",
            "story": "📖",
            "visual": "👁️",
            "movie": "🎬",
            "time": "⏰",
            "reaction": "⚡",
            "reflex": "⚡"
        };
        
        function getGameIcon(gameName) {
            const lowerName = gameName.toLowerCase();
            for (const [key, icon] of Object.entries(gameIcons)) {
                if (lowerName.includes(key)) {
                    return icon;
                }
            }
            return "🎮"; // Default game controller emoji
        }
        
        function formatGameName(name) {
            return name
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        function renderGames(gamesToRender) {
            gridContainer.innerHTML = '';
            
            if (gamesToRender.length === 0) {
                gridContainer.innerHTML = '<div class="no-results">No games found</div>';
                gameCount.textContent = '0';
                return;
            }
            
            gamesToRender.forEach(game => {
                const link = document.createElement('a');
                link.href = `./${game}/index.html`;
                link.className = 'game-card';
                link.innerHTML = `
                    <div class="game-card-content">
                        <span class="game-card-icon">${getGameIcon(game)}</span>
                        <div class="game-card-title">${formatGameName(game)}</div>
                    </div>
                `;
                gridContainer.appendChild(link);
            });
            
            gameCount.textContent = gamesToRender.length;
        }
        
        function filterGames(searchTerm) {
            const term = searchTerm.toLowerCase();
            return games.filter(game => 
                game.toLowerCase().includes(term)
            );
        }
        
        searchInput.addEventListener('input', (e) => {
            const filtered = filterGames(e.target.value);
            renderGames(filtered);
        });
        
        // Initial render
        loadGames();
    </script>
</body>
</html>
