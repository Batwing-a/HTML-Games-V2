        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
        }
        
        #searchInput {
            flex: 1;
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        #searchInput:focus {
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.3);
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .game-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            display: block;
            color: #333;
        }
        
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .game-card-content {
            padding: 20px;
            text-align: center;
        }
        
        .game-card-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        
        .game-card-title {
            font-size: 1em;
            font-weight: 600;
            word-break: break-word;
            overflow-wrap: break-word;
        }
        
        .no-results {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 40px;
            grid-column: 1 / -1;
        }
        
        .game-count {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>

        function getGameIcon(gameName) {
            const lowerName = gameName.toLowerCase();
            for (const [key, icon] of Object.entries(gameIcons)) {
                if (lowerName.includes(key)) {
                    return icon;
                }
            }
            return "🎮"; // Default game controller emoji
        }
        
        function formatGameName(name) {
            return name
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }
        
        function renderGames(gamesToRender) {
            gridContainer.innerHTML = '';
            
            if (gamesToRender.length === 0) {
                gridContainer.innerHTML = '<div class="no-results">No games found</div>';
                gameCount.textContent = '0';
                return;
            }
            
            gamesToRender.forEach(game => {
                const link = document.createElement('a');
                link.href = `./${game}/index.html`;
                link.className = 'game-card';
                link.innerHTML = `
                    <div class="game-card-content">
                        <span class="game-card-icon">${getGameIcon(game)}</span>
                        <div class="game-card-title">${formatGameName(game)}</div>
                    </div>
                `;
                gridContainer.appendChild(link);
            });
            
            gameCount.textContent = gamesToRender.length;
        }
        
        function filterGames(searchTerm) {
            const term = searchTerm.toLowerCase();
            return games.filter(game => 
                game.toLowerCase().includes(term)
            );
        }
        
        searchInput.addEventListener('input', (e) => {
            const filtered = filterGames(e.target.value);
            renderGames(filtered);
        });
